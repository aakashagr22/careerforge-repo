services:
  # ==========================================================
  # 1. Spring Boot Java 21 Backend Web Service
  # ==========================================================
  - type: web
    name: careerforge-backend
    runtime: docker
    dockerfilePath: ./careerforge/Dockerfile
    dockerContext: ./careerforge
    plan: free
    # Keep health checks lightweight. Generating OpenAPI is much slower than a health probe.
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8082
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: JWT_REFRESH_EXPIRATION_MS
        value: 604800000
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DEMO_DATA_ENABLED
        value: "false"
      - key: DEMO_STUDENT_COUNT
        value: "500"
      - key: DEMO_COMMUNITY_QUESTION_COUNT
        value: "24"

  # ==========================================================
  # 2. React Vite Frontend Static Site
  # ==========================================================
  - type: web
    name: careerforge-frontend
    runtime: static
    rootDir: careerforge-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://careerforge-backend-7p3w.onrender.com
