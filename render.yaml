services:
  # ==========================================================
  # 1. Spring Boot Java 21 Backend Web Service
  # ==========================================================
  - type: web
    name: careerforge-backend
    runtime: docker
    dockerfilePath: ./careerforge/Dockerfile
    dockerContext: ./careerforge
    plan: free
    healthCheckPath: /v3/api-docs
    envVars:
      - key: PORT
        value: 8082
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: JWT_REFRESH_EXPIRATION_MS
        value: 604800000
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        value: 587
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

  # ==========================================================
  # 2. React Vite Frontend Static Site
  # ==========================================================
  - type: web
    name: careerforge-frontend
    runtime: static
    rootDir: careerforge-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://careerforge-backend-7p3w.onrender.com
